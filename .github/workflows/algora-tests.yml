name: Algora tests

on:
  push:
    branches: [main]
    paths:
      - 'algora.py'
      - 'test_algora.py'
      - '.github/workflows/algora-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'algora.py'
      - 'test_algora.py'
      - '.github/workflows/algora-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algora:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Algora tests
        run: python -m unittest test_algora -v
